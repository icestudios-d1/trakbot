# Builds the Windows and Mac agents on GitHub's own Windows/macOS machines and publishes them to a rolling
# release called "agent-latest". The server PC's update.ps1 downloads that release into server/dist, so nobody
# has to own a Mac (or build anything by hand). Runs on every push to main that touches the agent.
#
# GitHub's Mac runners (Intel especially) are scarce, and a job waiting for one can sit queued for a long time. So the
# release does NOT wait for any Mac: Windows publishes as soon as it is built, and each Mac binary is added to the same
# release whenever its runner turns up (publish-mac-*). Until then the previously published Mac binaries are carried
# over, so Macs can still be installed and updated.
name: agents
on:
  push:
    branches: [main]
    paths: ["agent/**", "browser-extension/**", "windows/build.ps1", "mac/build.sh", ".github/workflows/agents.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agents-release        # two runs must never delete/recreate the release at the same time
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./windows/build.ps1 -OutDir "$PWD\out"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: win, path: out/* }
  mac-arm64:   # Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: OUT_DIR="$PWD/out" ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: mac-arm64, path: out/* }
  mac-x86_64:   # Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: OUT_DIR="$PWD/out" ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: mac-x86_64, path: out/* }
  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, name: win }
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the Mac binaries of the previous release until fresh ones are built.
          mkdir -p old
          gh release download agent-latest --repo "$GITHUB_REPOSITORY" --dir old \
            --pattern 'cyril-mac-*' --pattern 'manifest-mac-*.json' || true
          for f in old/*; do
            [ -f "$f" ] && [ ! -f "files/$(basename "$f")" ] && cp "$f" "files/$(basename "$f")"
          done
          gh release delete agent-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create agent-latest files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agents (latest)" --notes "Built from $GITHUB_SHA. A Mac build may lag behind if its runner was busy."
  publish-mac-arm64:
    needs: [mac-arm64, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: mac, name: mac-arm64 }
      - name: Add the Apple Silicon build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload agent-latest mac/* --clobber --repo "$GITHUB_REPOSITORY"
  publish-mac-x86_64:
    needs: [mac-x86_64, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: mac, name: mac-x86_64 }
      - name: Add the Intel build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload agent-latest mac/* --clobber --repo "$GITHUB_REPOSITORY"
