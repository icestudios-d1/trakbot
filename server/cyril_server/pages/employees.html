<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employees · Cyril</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main>
<div class="pagehead"><div><h1>Employees</h1><p id="sub">Everyone who has reported activity</p></div><div class="formrow"><input id="q" type="search" placeholder="Search employees" aria-label="Search employees"><button id="grpToggle" title="Create groups, such as a business unit, or a group for PCs that are not handed out yet">Manage groups</button></div></div>
<div id="range"></div>
<div id="err" class="callout" style="display:none"></div>
<div class="card" id="grpPanel" style="display:none;margin-bottom:16px">
  <h2>Groups</h2>
  <div class="sub">Put employees in groups (a business unit, or machines not allocated yet). Pick a group at the top of Overview or here to look at it alone. A group marked <b>excluded</b> is left out of the regular reports and only shows when you pick it.</div>
  <div class="formrow" style="margin-bottom:12px"><input id="gName" placeholder="New group name" maxlength="60" aria-label="New group name" style="min-width:200px"><label class="mut" style="display:flex;gap:6px;align-items:center"><input id="gEx" type="checkbox" style="min-height:0"> Exclude from regular reports</label><button class="primary" id="gAdd">Add group</button></div>
  <div class="grpgrid" id="grpList"></div>
</div>
<div class="card">
  <div class="formrow noprint" id="bulk" style="margin-bottom:10px;display:none"><b id="bulkN"></b><select id="bulkG" aria-label="Move to group"></select><button class="primary" id="bulkGo">Move to group</button><button id="bulkClear">Clear selection</button></div>
  <div class="scroll"><table id="t"></table></div>
</div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,fmt,esc}=TB;let data=[],groups=[],seq=0,sort='a',picked=new Set();
const rb=TB.rangeBar($('#range'),{defDays:7,slot:true,group:true,onChange:load});
async function load(r){
  const me=++seq;TB.error();
  try{
    const [users,o,g]=await Promise.all([TB.users(),TB.api('/api/overview?'+TB.qs({start:r.start,end:r.end,tz:TB.tz,group:r.group})),TB.groups()]);
    if(me!==seq)return;
    groups=g.groups;
    $('#sub').textContent=TB.rangeLabel(r.start,r.end)+TB.slotNote(o.slot)+(TB.scope()==='work'?' · work hours only (9:30 AM–8:30 PM)':'');
    // With a group picked, only its people are listed; the numbers come from the same filtered report.
    const inView=u=>r.group==='all'||(r.group===''?!u.group_excluded:r.group==='none'?!u.group_id:String(u.group_id)===r.group);
    data=users.filter(inView).map(u=>{const m=o.by_user[u.user]||{};const a=(m.productive||0)+(m.unproductive||0)+(m.neutral||0);
      return {u:u.user,name:TB.dn(u.user),devices:u.devices,last:u.last_seen,a,idle:m.idle||0,p:a?100*m.productive/a:null,top:m.top_app,gid:u.group_id,gname:u.group,gex:!!u.group_excluded}});
    picked=new Set([...picked].filter(x=>data.some(d=>d.u===x)));
    render();renderGroups();
  }catch(e){if(me===seq)TB.error(e)}
}
const groupOpts=(sel)=>`<option value="">No group</option>`+groups.map(g=>`<option value="${g.id}" ${String(sel)===String(g.id)?'selected':''}>${esc(g.name)}${g.excluded?' (excluded)':''}</option>`).join('');
async function assign(users,gid){
  await TB.api('/api/users/group',{method:'POST',body:JSON.stringify({users,group_id:gid?+gid:null})});
  await refreshUsers();
}
async function refreshUsers(){ // names/groups changed: reload the list (the report itself is cached server-side for a moment, so this is quick)
  TB.users.reset&&TB.users.reset();await load(rb.get());
}
function render(){
  const q=$('#q').value.toLowerCase();
  const rows=data.filter(d=>(d.name+' '+d.u+' '+(d.gname||'')).toLowerCase().includes(q)).sort((x,y)=>sort==='n'?x.name.localeCompare(y.name):sort==='p'?(y.p??-1)-(x.p??-1):y.a-x.a);
  const th=(k,t,c='')=>`<th class="${c}"><a href="#" data-s="${k}" style="color:inherit">${t}${sort===k?' ↓':''}</a></th>`;
  const all=rows.length&&rows.every(d=>picked.has(d.u));
  $('#t').innerHTML=`<thead><tr><th style="width:28px"><input type="checkbox" id="pickAll" aria-label="Select all shown" ${all?'checked':''} style="min-height:0"></th>${th('n','Employee')}<th>Group</th>${th('a','Active time','right')}${th('p','Productivity')}<th>Top app</th><th>Devices</th><th>Last seen</th><th></th></tr></thead><tbody>`+
   (rows.map(d=>`<tr class="link"><td><input type="checkbox" class="pick" data-u="${esc(d.u)}" aria-label="Select ${esc(d.name)}" ${picked.has(d.u)?'checked':''} style="min-height:0"></td><td><a href="/employee?${TB.qs({user:d.u,start:rb.get().start,end:rb.get().end})}"><b>${esc(d.name)}</b></a>${d.name!==d.u?` <span class="mut sm">${esc(d.u)}</span>`:''}</td><td><select class="gsel" data-g="${esc(d.u)}" aria-label="Group of ${esc(d.name)}" style="min-width:120px;width:auto">${groupOpts(d.gid)}</select></td><td class="right num">${d.a?fmt(d.a):'<span class="mut">–</span>'}</td><td style="min-width:150px">${d.p==null?'<span class="mut">no activity</span>':`<div class="stackbar"><i style="width:${d.p}%;background:var(--c-p)"></i></div><span class="sm mut">${TB.pct(d.p)}</span>`}</td><td>${esc(d.top||'–')}</td><td class="num">${d.devices}</td><td class="mut nowrap">${TB.when(d.last)}</td><td class="right nowrap"><button class="chip" data-sn="${esc(d.u)}" title="Take a screenshot of this PC right now">Screenshot now</button> <button class="chip" data-rn="${esc(d.u)}" title="Set who uses this login">Rename</button> <button class="chip danger" data-del="${esc(d.u)}" title="Permanently delete this employee and all their data">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No employees found.</td></tr>')+'</tbody>';
  const t=$('#t');
  t.querySelectorAll('[data-s]').forEach(a=>a.onclick=e=>{e.preventDefault();sort=a.dataset.s;render()});
  t.querySelectorAll('[data-rn]').forEach(b=>b.onclick=async e=>{e.stopPropagation();try{if(await TB.rename(b.dataset.rn)){data=data.map(d=>({...d,name:TB.dn(d.u)}));render()}}catch(x){TB.error(x)}});
  t.querySelectorAll('[data-sn]').forEach(b=>b.onclick=e=>{e.stopPropagation();TB.screenshotNow(b.dataset.sn).catch(TB.error)});
  t.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();try{if(await TB.deleteEmployee(b.dataset.del)){data=data.filter(d=>d.u!==b.dataset.del);render()}}catch(x){TB.error(x)}});
  t.querySelectorAll('.gsel').forEach(s=>{s.onclick=e=>e.stopPropagation();s.onchange=async()=>{try{await assign([s.dataset.g],s.value)}catch(x){TB.error(x)}}});
  t.querySelectorAll('.pick').forEach(c=>{c.onclick=e=>e.stopPropagation();c.onchange=()=>{c.checked?picked.add(c.dataset.u):picked.delete(c.dataset.u);bulk()}});
  $('#pickAll').onchange=e=>{rows.forEach(d=>e.target.checked?picked.add(d.u):picked.delete(d.u));render()};
  t.querySelectorAll('tr.link').forEach(tr=>tr.onclick=e=>{if(!/^(A|SELECT|INPUT|BUTTON|OPTION)$/.test(e.target.tagName))location.href=tr.querySelector('a').href});
  bulk();
}
function bulk(){
  $('#bulk').style.display=picked.size?'':'none';
  $('#bulkN').textContent=picked.size+' selected';
  const cur=$('#bulkG').value;$('#bulkG').innerHTML=groupOpts('');$('#bulkG').value=cur;
}
$('#bulkGo').onclick=async()=>{try{await assign([...picked],$('#bulkG').value);picked.clear()}catch(x){TB.error(x)}};
$('#bulkClear').onclick=()=>{picked.clear();render()};

function renderGroups(){
  $('#grpList').innerHTML=groups.length?groups.map(g=>`<div class="grpcard" data-id="${g.id}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(g.name)}</b><span class="tag grp ${g.excluded?'ex':''}">${g.excluded?'excluded':'in reports'}</span></div><div class="mut sm">${g.members} employee${g.members===1?'':'s'}</div><div class="formrow"><button class="chip" data-ren="${g.id}">Rename</button><button class="chip" data-ex="${g.id}">${g.excluded?'Include in reports':'Exclude from reports'}</button><button class="chip danger" data-gd="${g.id}">Delete</button></div></div>`).join(''):'<div class="mut">No groups yet. Add one above, then choose it in the Group column.</div>';
  const byId=id=>groups.find(g=>g.id===+id);
  const save=async(g,patch)=>{try{await TB.api('/api/groups/'+g.id,{method:'PUT',body:JSON.stringify({name:g.name,excluded:g.excluded,...patch})});location.reload()}catch(x){TB.error(x)}};
  $('#grpList').querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const g=byId(b.dataset.ren),n=prompt('New name for this group:',g.name);if(n&&n.trim())save(g,{name:n.trim()})});
  $('#grpList').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const g=byId(b.dataset.ex);save(g,{excluded:!g.excluded})});
  $('#grpList').querySelectorAll('[data-gd]').forEach(b=>b.onclick=async()=>{const g=byId(b.dataset.gd);if(!confirm(`Delete the group "${g.name}"? Its ${g.members} employee(s) are kept and become ungrouped.`))return;try{await TB.api('/api/groups/'+g.id,{method:'DELETE'});location.reload()}catch(x){TB.error(x)}});
}
$('#gAdd').onclick=async()=>{
  const name=$('#gName').value.trim();if(!name)return;
  try{await TB.api('/api/groups',{method:'POST',body:JSON.stringify({name,excluded:$('#gEx').checked})});$('#gName').value='';$('#gEx').checked=false;location.reload()}catch(x){TB.error(x)}
};
$('#gName').onkeydown=e=>{if(e.key==='Enter')$('#gAdd').click()};
$('#grpToggle').onclick=()=>{const p=$('#grpPanel');p.style.display=p.style.display==='none'?'':'none'};
$('#q').oninput=render;
</script></body></html>
